name: Tip release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build (macOS arm64)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package
        run: |
          cd target/aarch64-apple-darwin/release
          tar czf drift-darwin-arm64.tar.gz drift
          shasum -a 256 drift-darwin-arm64.tar.gz > drift-darwin-arm64.tar.gz.sha256

      - name: Update tip release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tip --yes --cleanup-tag 2>/dev/null || true
          gh release create tip \
            --title "Tip (latest build)" \
            --notes "Built from \`${{ github.sha }}\`." \
            --prerelease \
            target/aarch64-apple-darwin/release/drift-darwin-arm64.tar.gz \
            target/aarch64-apple-darwin/release/drift-darwin-arm64.tar.gz.sha256
